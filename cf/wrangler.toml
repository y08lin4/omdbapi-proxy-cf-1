name = "omdb-api-manager"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Do not put real keys in wrangler.toml.
# Use .dev.vars locally and wrangler secret put for production secrets.
[vars]
OMDB_API_URL = "https://www.omdbapi.com/"
OMDB_POSTER_URL = "https://img.omdbapi.com/"
HTTP_TIMEOUT = "10s"
KEY_COOLDOWN = "5m"
MAX_ATTEMPTS_PER_REQUEST = "0"
CORS_ORIGIN = "*"

# 可选：绑定 Cloudflare KV 后，/metrics 的今日请求数和总请求数会持久化，
# 同时可在 KV 的 omdb:keys 中保存大体积 OMDb key 池。
# 注意：wrangler.toml 里必须填写 KV Namespace ID，不能只写控制台显示名称。
# 你控制台里的绑定名称是 STATS_KV，KV 命名空间显示名称是 omdbapi-proxy。
# 在 Cloudflare 控制台打开该 KV 命名空间，复制 Namespace ID 后取消注释下面配置；
# 之后 GitHub 自动部署会按配置自动绑定，不需要每次重新手动绑定。
# [[kv_namespaces]]
# binding = "STATS_KV"
# id = "填入 omdbapi-proxy 这个 KV 的 Namespace ID"
# preview_id = "可选：填入预览 KV 的 Namespace ID；没有可先与 id 相同"
